
name: Arcadia - Preparar despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: usuarios
            path: backend/ms-usuarios/usuarios-Feature
          - name: comics
            path: backend/ms-comics/FS3-Arcadia-Backend-Comics-main
          - name: ventas
            path: backend/ms-ventas/ms-ventas
          - name: api-gateway
            path: backend/api-gateway

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      - name: Compilar el microservicio
        working-directory: ${{ matrix.path }}
        run: mvn -B -ntp -DskipTests package

      - name: Guardar archivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.name }}
          path: ${{ matrix.path }}/target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clientes
            path: Frontend/Arcadia-FrontEnd-Clientes
          - name: login
            path: Frontend/Arcadia-FrontEnd-Login
          - name: admin
            path: Frontend/Arcadia-FrontEnd-Admin

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Instalar dependencias
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Generar build de produccion
        working-directory: ${{ matrix.path }}
        run: npm run build

      - name: Guardar archivos del frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.name }}
          path: ${{ matrix.path }}/dist/
          if-no-files-found: error
          retention-days: 7
