# Configuración del Servidor API Manager / Gateway
server.port=8083
server.servlet.context-path=/

# Nombre de la aplicación
spring.application.name=API Manager Arcadia Comics

# Base de Datos H2 en Memoria
spring.datasource.url=jdbc:h2:mem:arcadiagatewaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 para inspeccionar tablas en tiempo de ejecución
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
