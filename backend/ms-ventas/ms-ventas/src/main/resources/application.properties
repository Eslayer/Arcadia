spring.application.name=ms-ventas

# Configuración del Puerto
server.port=8082

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/arcadia_ventas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==========================================
# Transbank WebPay Plus - Ambiente de Integración
# ==========================================
transbank.webpay.commerce-code=597055555532
transbank.webpay.api-key=579B532A7440BB061079DCD944E0EE86481E261648C18859362849C5B4333827
transbank.webpay.base-url=https://webpay3gint.transbank.cl
# URL de retorno donde Transbank redirige al completar el pago (backend de ventas)
transbank.webpay.return-url=http://localhost:8082/orders/webpay/return

# Frontend Clientes URL para redirección final tras el procesamiento
app.frontend.client-url=http://localhost:3000

# ==========================================
# Amazon Web Services (AWS) - Amazon SQS
# ==========================================
aws.region=us-east-1
aws.sqs.queue-url=${AWS_SQS_QUEUE_URL:}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.sqs.enabled=true

