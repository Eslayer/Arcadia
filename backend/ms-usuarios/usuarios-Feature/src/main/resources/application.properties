server.port=8085
spring.application.name=microservicio-usuarios

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/arcadia_usuarios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (usando un valor por defecto para local)
jwt.secret=${JWT_SECRET:QXJjYWRpYVN1cGVyU2VjcmV0S2V5MTIzNDU2Nzg5MCFBcmNhZGlhU2VjcmV0}
jwt.expiration-ms=86400000

# Logs
logging.level.org.springframework.web=INFO
logging.level.com.arcadia.usuarios=INFO
logging.level.org.springframework.security=WARN

# ==========================================
# Amazon Web Services (AWS) - Kinesis Data Streams -> Firehose
# ==========================================
aws.region=${AWS_REGION:us-east-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.session-token=${AWS_SESSION_TOKEN:}

aws.kinesis.enabled=${AWS_KINESIS_ENABLED:true}
aws.kinesis.stream-name=${AWS_KINESIS_STREAM_NAME:arcadia-usuarios-stream}
